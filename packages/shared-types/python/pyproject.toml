[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govflow-shared-types"
version = "0.1.0"
description = "GovFlow shared Pydantic v2 models"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["govflow_shared_types*"]
